name: Build and publish BudgetPro apps

on:
  push:
    branches: [main]
    paths:
      - native/**
      - .github/workflows/native-release.yml
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: budgetpro-native-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  NATIVE_VERSION: 1.0.${{ github.run_number }}
  NATIVE_VERSION_CODE: ${{ github.run_number }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.release-check.outputs.should_build }}
      deployment: ${{ steps.release-check.outputs.deployment }}
    steps:
      - uses: actions/checkout@v7
      - id: release-check
        name: Compare deployed and packaged revisions
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          deployment=$(curl --fail --silent --show-error --max-time 30 https://budgetpro-afq2.onrender.com/api/native-deployment | jq -r '.commit // "local"' || true)
          if [[ -z "$deployment" || "$deployment" == "null" ]]; then
            deployment="local"
          fi
          latest_body=$(gh release view --repo PixieStack/budgetpro-releases --json body --jq '.body' 2>/dev/null || true)
          should_build=false
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            should_build=true
          elif [[ "$deployment" != "local" && "$latest_body" != *"Source deployment: $deployment"* ]]; then
            should_build=true
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "Deployment: $deployment; build required: $should_build"

  windows:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/windows/package-lock.json
      - name: Install desktop dependencies
        working-directory: native/windows
        run: npm ci
      - name: Set desktop version
        working-directory: native/windows
        shell: pwsh
        run: npm version --no-git-tag-version $env:NATIVE_VERSION
      - name: Build Windows installer
        working-directory: native/windows
        run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            native/windows/dist/*.exe
            native/windows/dist/*.blockmap
            native/windows/dist/latest.yml
          if-no-files-found: error

  android:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/android/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Android dependencies and sync Capacitor
        working-directory: native/android
        run: |
          npm ci
          npx cap sync android
      - name: Restore release signing key
        working-directory: native/android/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > budgetpro-release.jks
      - name: Build signed Android APK
        working-directory: native/android/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/native/android/android/budgetpro-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify Android signature and package identity
        working-directory: native/android/android
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          package_info=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -n 1)
          echo "$package_info"
          [[ "$package_info" == *"name='com.pixiestack.budgetpro'"* ]]
          [[ "$package_info" == *"versionName='${NATIVE_VERSION}'"* ]]
      - name: Name Android package
        run: mv native/android/android/app/build/outputs/apk/release/app-release.apk "BudgetPro-${NATIVE_VERSION}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: BudgetPro-*.apk
          if-no-files-found: error

  publish:
    needs: [detect, windows, android]
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish native release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ needs.detect.outputs.deployment }}
        run: |
          gh release create "v${NATIVE_VERSION}" release-assets/* \
            --repo PixieStack/budgetpro-releases \
            --title "BudgetPro v${NATIVE_VERSION}" \
            --notes "Official BudgetPro Android and Windows release. Source deployment: ${DEPLOYMENT}"

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Keep scheduled update checks active
        run: |
          if find .github/keepalive -mtime +25 -print -quit | grep -q .; then
            date -u +%F > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "Keep native release checks active"
            git push
          fi
